[package]
name = "acolor"
version = "0.2.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
# Terminal width for the swatch strip (already pulled in by indicatif)
console = "0.16.6"
image = "0.25.10"
indicatif = "0.18.6"
# "tracing" routes rodio's stream-error messages through the tracing crate
# instead of eprintln!, so they stay silent (we report errors ourselves)
rodio = { version = "0.22.2", features = ["tracing"] }
rustfft = "6.4.1"
